<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Insurance App — Framer Motion Study</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: radial-gradient(1200px 700px at 70% -10%, #23242b, #101014 60%);
    color:#e8e8ea; overflow:hidden;
  }
  #root { height:100%; display:flex; align-items:center; justify-content:center; }

  /* ---------- page chrome ---------- */
  .demo-bar { position:fixed; top:18px; left:22px; z-index:50;
    display:flex; align-items:center; gap:12px; }
  .demo-bar button { font:600 13px/1 inherit; color:#101014; background:#f0efec;
    border:0; border-radius:999px; padding:10px 18px; cursor:pointer; }
  .demo-bar .hint { font-size:12px; color:#7d7d85; }
  .caption { position:fixed; bottom:16px; left:0; right:0; text-align:center;
    font-size:12px; color:#5b5b63; letter-spacing:.02em; }

  /* ---------- phone ---------- */
  .phone { width:418px; height:872px; border-radius:62px;
    background:#0c0c0e; padding:14px; position:relative;
    box-shadow: 0 40px 90px rgba(0,0,0,.55), 0 4px 18px rgba(0,0,0,.4),
                inset 0 0 0 2px #3a3a40; }
  .screen { width:390px; height:844px; border-radius:48px; overflow:hidden;
    position:relative; background:#f2efe9; }
  .notch { position:absolute; top:14px; left:50%; transform:translateX(-50%);
    width:118px; height:34px; border-radius:20px; background:#0c0c0e; z-index:40; }
  .view { position:absolute; inset:0; }

  /* ---------- home ---------- */
  .hero { position:absolute; inset:0 0 44% 0; overflow:hidden;
    background:linear-gradient(180deg,#d8cfd2 0%,#e8ddd2 55%,#f2efe9 100%); }
  .hero::after { content:""; position:absolute; left:0; right:0; bottom:-1px; height:180px;
    background:linear-gradient(180deg, transparent, #f2efe9 82%); }
  .blob { position:absolute; border-radius:50%; filter:blur(46px); }
  .b1 { width:420px; height:420px; right:-120px; top:-110px;
        background:radial-gradient(circle at 35% 35%, #ff9b57, #f4593a 70%, transparent 72%); }
  .b2 { width:300px; height:300px; left:-90px; top:60px; opacity:.85;
        background:radial-gradient(circle at 60% 40%, #b9aecb, #9d93b8 65%, transparent 70%); }
  .b3 { width:240px; height:240px; left:120px; top:-90px; opacity:.9;
        background:radial-gradient(circle, #ffc08a, transparent 70%); }

  .home-content { position:absolute; inset:0; padding:78px 20px 0; z-index:2; }
  .welcome { text-align:center; color:#fff; text-shadow:0 2px 14px rgba(120,40,10,.25); }
  .w-small { font-size:13px; font-weight:500; opacity:.9; letter-spacing:.03em; }
  .w-name  { font-size:27px; font-weight:700; letter-spacing:-.02em; margin-top:2px; }

  .chev-row { margin:18px 2px 10px; height:34px; border-radius:17px;
    background:rgba(255,255,255,.55); display:flex; align-items:center;
    justify-content:flex-end; padding:0 14px; color:#4c4c52; font-size:14px; }

  .premium-card { background:#fff; border-radius:24px; padding:0 0 18px;
    box-shadow:0 18px 40px rgba(60,40,20,.14); position:relative; overflow:hidden; }
  .claims-strip { display:flex; align-items:center; gap:10px;
    background:linear-gradient(90deg,#fbe3d2,#f7ede2 70%); padding:12px 16px; }
  .claims-strip .ticket { width:30px; height:30px; border-radius:9px; flex:0 0 auto;
    background:linear-gradient(160deg,#ff9b57,#ef5a35); color:#fff; font-size:12px;
    font-weight:700; display:flex; align-items:center; justify-content:center; }
  .claims-strip span { font-size:13px; color:#5a4a3e; font-weight:500; }
  .receipt-ghost { position:absolute; right:16px; top:52px; opacity:.14; }
  .pc-body { padding:16px 18px 0; }
  .pc-title { font-size:19px; font-weight:700; color:#1d1e22; letter-spacing:-.01em; }
  .pc-due { display:flex; align-items:center; gap:6px; margin-top:6px;
    font-size:12.5px; color:#96969c; }
  .pc-row { display:flex; align-items:flex-end; justify-content:space-between; margin-top:16px; }
  .pc-amount { font-size:15px; font-weight:600; color:#3a3b40; padding-bottom:8px; }
  .btn-dark { background:#17181c; color:#fff; border:0; cursor:pointer;
    font:600 13.5px/1 inherit; padding:14px 22px; border-radius:999px;
    box-shadow:0 10px 22px rgba(15,15,20,.35); display:flex; align-items:center; gap:8px; }

  .section-title { font-size:19px; font-weight:700; color:#26272c; margin:24px 4px 12px; }
  .services { display:flex; flex-wrap:wrap; gap:10px; }
  .chip { display:flex; align-items:center; gap:7px; background:#fbfaf7;
    border:1px solid rgba(0,0,0,.04); border-radius:999px; padding:11px 16px;
    font-size:13px; font-weight:600; color:#3c3d43; cursor:pointer;
    box-shadow:0 6px 16px rgba(70,50,30,.07); }
  .chip svg { color:#8f9097; }
  .event-card { background:#fff; border-radius:20px; padding:14px 16px; margin-top:2px;
    display:flex; align-items:center; gap:12px; box-shadow:0 10px 24px rgba(60,40,20,.08); }
  .event-thumb { width:44px; height:44px; border-radius:14px; flex:0 0 auto;
    background:linear-gradient(140deg,#ffd9a8,#f4744a); }
  .event-card b { font-size:13.5px; color:#2a2b30; display:block; }
  .event-card small { font-size:12px; color:#9a9aa1; }

  .bottomnav { position:absolute; left:0; right:0; bottom:0; z-index:3;
    background:rgba(250,249,246,.92); backdrop-filter:blur(10px);
    border-top:1px solid rgba(0,0,0,.05);
    display:flex; justify-content:space-around; padding:12px 10px 26px; }
  .nav-item { display:flex; flex-direction:column; align-items:center; gap:4px;
    font-size:10.5px; font-weight:600; color:#a0a0a7; }
  .nav-item.active { color:#1d1e22; }
  .home-indicator { position:absolute; bottom:8px; left:50%; transform:translateX(-50%);
    width:130px; height:5px; border-radius:3px; background:#1d1e22; z-index:5; }

  /* ---------- premium modal ---------- */
  .modal-layer { position:absolute; inset:0; z-index:20; }
  .modal-dim { position:absolute; inset:0; background:rgba(214,205,196,.36); }
  .modal-close { position:absolute; top:66px; right:22px; z-index:3; }
  .circle-btn { width:42px; height:42px; border-radius:50%; border:0; cursor:pointer;
    background:#fff; color:#26272c; display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 20px rgba(50,40,30,.18); font-size:15px; }
  .pay-sheet { position:absolute; left:18px; right:18px; top:300px; z-index:2;
    background:rgba(24,25,29,.94); border-radius:24px; padding:20px 18px 18px;
    box-shadow:0 30px 70px rgba(10,10,15,.45); color:#fff; }
  .sheet-h1 { font-size:18px; font-weight:700; letter-spacing:-.01em; color:#fff; }
  .sheet-sub { display:flex; align-items:center; gap:6px; font-size:12px; color:#9d9da5; margin-top:5px; }
  .member { display:flex; align-items:center; gap:11px; background:#26272d;
    border-radius:18px; padding:12px 14px; margin-top:10px; }
  .m-check { width:22px; height:22px; border-radius:50%; flex:0 0 auto;
    background:linear-gradient(150deg,#ff9b57,#ef5a35); display:flex;
    align-items:center; justify-content:center; }
  .m-ava { width:38px; height:38px; border-radius:50%; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:700; color:#fff; }
  .m-info { flex:1; min-width:0; }
  .m-name { font-size:14px; font-weight:600; }
  .m-id { font-size:11px; color:#8f8f98; margin-top:2px; }
  .m-price { font-size:14px; font-weight:700; }
  .slide-track { position:relative; margin-top:16px; height:58px; border-radius:29px;
    background:#101114; overflow:hidden; touch-action:none; }
  .slide-fill { position:absolute; inset:0 auto 0 0; width:0;
    background:linear-gradient(90deg,#2c2d33,#3a3b42); border-radius:29px; }
  .slide-hint { position:absolute; inset:0; display:flex; align-items:center;
    justify-content:center; padding-left:90px; font-size:12.5px; color:#87878f; }
  .knob { position:absolute; top:6px; left:6px; height:46px; padding:0 22px;
    border-radius:23px; background:#f0efec; color:#141519; font-size:13.5px;
    font-weight:700; display:flex; align-items:center; gap:8px; cursor:grab;
    user-select:none; touch-action:none; box-shadow:0 6px 16px rgba(0,0,0,.4); }
  .pay-success { position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:12px; }
  .pay-success div { font-size:15px; font-weight:600; }
  .pay-success small { font-size:12px; color:#9d9da5; margin-top:-6px; }

  /* ---------- hospitals ---------- */
  .map-bg { position:absolute; inset:0; }
  .map-bg svg { width:100%; height:100%; display:block; }
  .screen-header { position:absolute; top:64px; left:18px; right:18px; z-index:5;
    display:flex; align-items:center; gap:14px; }
  .screen-header h1 { font-size:20px; font-weight:700; color:#26272c; letter-spacing:-.01em; }
  .screen-header .spacer { flex:1; }
  .pin { position:absolute; z-index:3; width:34px; height:34px; margin:-17px 0 0 -17px;
    border-radius:50%; background:#fff; box-shadow:0 6px 14px rgba(60,45,25,.22);
    display:flex; align-items:center; justify-content:center; color:#ef6135; }
  .hosp-cards { position:absolute; left:16px; right:16px; bottom:24px; z-index:6; }
  .hosp-card { position:relative; background:#fff; border-radius:24px; padding:14px 16px 14px 112px;
    min-height:96px; margin-top:12px; cursor:pointer;
    box-shadow:0 16px 36px rgba(60,40,20,.16); }
  .hc-thumb { position:absolute; left:14px; top:14px; bottom:14px; width:84px;
    border-radius:16px; overflow:hidden; }
  .hc-thumb svg { width:100%; height:100%; display:block; }
  .tag { display:inline-block; font-size:10.5px; font-weight:700; color:#4b3520;
    padding:5px 10px; border-radius:999px; letter-spacing:.02em; }
  .tag.orange { background:linear-gradient(90deg,#ffb469,#ff9052); }
  .tag.pink   { background:linear-gradient(90deg,#ffb9c8,#ff97ad); color:#5c2433; }
  .tag.blue   { background:linear-gradient(90deg,#b9d4ff,#96bdf5); color:#1f3a63; }
  .hc-name { font-size:15px; font-weight:700; color:#26272c; margin-top:7px; }
  .hc-addr { display:flex; align-items:center; gap:5px; font-size:12px; color:#96969c; margin-top:4px; }

  /* ---------- hospital detail ---------- */
  .detail-card { position:absolute; left:16px; right:16px; top:120px; z-index:6;
    background:#fff; border-radius:24px; padding:14px 18px 18px;
    box-shadow:0 24px 54px rgba(60,40,20,.2); }
  .detail-photo { border-radius:16px; overflow:hidden; height:190px; }
  .detail-photo svg { width:100%; height:100%; display:block; }
  .detail-card .tag { margin-top:14px; }
  .d-name { font-size:20px; font-weight:700; color:#212227; letter-spacing:-.01em; margin-top:8px; }
  .d-meta { display:flex; align-items:center; gap:6px; font-size:12.5px; color:#96969c; margin-top:7px; }
  .d-meta .ok { color:#3f9d63; font-weight:600; }
  .d-actions { display:flex; align-items:center; gap:10px; margin-top:16px; }
  .icon-btn { width:44px; height:44px; border-radius:50%; border:1px solid #ececea;
    background:#faf9f6; color:#3c3d43; display:flex; align-items:center;
    justify-content:center; cursor:pointer; }
  .route-map { position:absolute; left:0; right:0; bottom:0; height:290px; z-index:4; }
  .route-map svg { width:100%; height:100%; display:block; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/framer-motion@10.18.0/dist/framer-motion.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>

<script type="text/babel" data-presets="react">
/* ================================================================
   Framer Motion motion study.
   - Shared-element ("magic motion") transitions via layoutId:
     the premium card morphs into the pay sheet, and each hospital
     card / thumbnail / tag / name persists into the detail view —
     only geometry re-projects, the elements never remount visually.
   - No rubber-banding: every spring uses bounce: 0 (critically
     damped) and drags use dragElastic: 0.
   ================================================================ */
const { useState, useRef, useEffect } = React;
const { motion, AnimatePresence, MotionConfig, useMotionValue, useTransform, animate } = Motion;

const SNAP = { type: 'spring', bounce: 0, duration: 0.85 };  /* no-overshoot spring */
const FADE = { duration: 0.38, ease: 'easeOut' };
/* one radius per shared-element pair — mismatched radii snap at the
   crossfade handoff and read as a corner stutter */
const R_CARD = 24, R_THUMB = 16;
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------------- data ---------------- */
const MEMBERS = [
  { name: 'Willie Schulist', id: 'HI1418872904-BB', price: '$1,232.98', grad: ['#f0a468', '#c96b3c'] },
  { name: 'Anne Marquardt',  id: 'HI1418872904-BB', price: '$1,232.98', grad: ['#9fb3d8', '#5f7bad'] },
  { name: 'Kristine Gibson', id: 'HI1418872904-BB', price: '$1,232.98', grad: ['#d8a0b8', '#a85f85'] },
];

const HOSPITALS = [
  { tag: 'General & Primary Care',     tagClass: 'orange', name: 'Harmony General Hospital', addr: 'Fenimore St 22A (2.3km)', hue: ['#f7b26a', '#d96a35', '#7a4a2a'] },
  { tag: 'Dental & Oral Health',       tagClass: 'pink',   name: 'VitalSpring Medical',      addr: 'Fenimore St 22A (2.3km)', hue: ['#f9c58f', '#e5813f', '#8a4a20'] },
  { tag: 'Mental & Behavioral Health', tagClass: 'blue',   name: 'CalmHarbor Clinic',        addr: 'Ocean Ave 140 (3.1km)',   hue: ['#bcd0e8', '#7d9cc4', '#3d5a80'] },
];

const PINS = [{ left: '22%', top: '41%' }, { left: '55%', top: '52%' }, { left: '38%', top: '63%' }];

/* ---------------- small icons ---------------- */
const IconClock = () => (
  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4">
    <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>);
const IconPlace = ({ s = 12 }) => (
  <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
    <path d="M12 21s-7-6.1-7-11a7 7 0 0 1 14 0c0 4.9-7 11-7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>);
const IconArrow = () => (
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.6">
    <path d="M5 12h14m-6-6 6 6-6 6"/></svg>);
const IconCheckSm = () => (
  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="3.4">
    <path d="M4 12.5l5.5 5.5L20 6.5"/></svg>);

/* ---------------- building illustration ---------------- */
function BuildingArt({ hue: [light, mid, dark], seed = 1 }) {
  const windows = [];
  for (let r = 0; r < 6; r++)
    for (let c = 0; c < 5; c++)
      windows.push(<rect key={`${r}-${c}`} x={104 + c * 30} y={36 + r * 26 + c * 6}
        width="20" height="14" rx="2" fill="#fff"
        opacity={0.35 + ((r * 5 + c + seed) % 4) * 0.16}/>);
  return (
    <svg viewBox="0 0 260 200" preserveAspectRatio="xMidYMid slice" style={{ width: '100%', height: '100%', display: 'block' }}>
      <rect width="260" height="200" fill="#e8e2d8"/>
      <polygon points="0,200 0,90 95,20 95,200" fill={mid}/>
      <polygon points="95,20 110,10 260,120 260,200 95,200" fill={light}/>
      <polygon points="95,20 95,200 110,200 110,10" fill={dark}/>
      {windows}
      <g stroke="#fff" strokeWidth="3" opacity=".5">
        <line x1="8" y1="98" x2="88" y2="40"/><line x1="8" y1="128" x2="88" y2="70"/>
        <line x1="8" y1="158" x2="88" y2="100"/><line x1="8" y1="188" x2="88" y2="130"/>
      </g>
    </svg>
  );
}

/* ---------------- map ---------------- */
function MapSVG() {
  return (
    <svg viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice">
      <rect width="390" height="844" fill="#efeae1"/>
      <path d="M-20 180 C 90 140, 150 210, 140 330 C 132 440, 60 520, -20 540 Z" fill="#dee7d2"/>
      <path d="M40 560 C 120 540, 190 590, 180 700 C 172 790, 90 830, 10 820 L -20 640 Z" fill="#e3ead6" opacity=".8"/>
      <g stroke="#ffffff" strokeWidth="12" fill="none" opacity=".95">
        <path d="M180 -20 L 320 844"/><path d="M-20 300 L 420 190"/><path d="M-20 430 L 420 330"/>
      </g>
      <g stroke="#ffffff" strokeWidth="6" fill="none" opacity=".8">
        <path d="M240 -20 L 360 844"/><path d="M120 -20 L 260 844"/>
        <path d="M-20 540 L 420 440"/><path d="M-20 650 L 420 560"/><path d="M-20 760 L 420 680"/>
      </g>
      <g fill="#a09a8e" fontSize="11" fontFamily="system-ui" fontWeight="500">
        <text x="228" y="252" transform="rotate(-14 228 252)">Empire Blvd</text>
        <text x="238" y="372" transform="rotate(-14 238 372)">Lefferts Ave</text>
        <text x="244" y="486" transform="rotate(-13 244 486)">Maple St</text>
        <text x="236" y="596" transform="rotate(-12 236 596)">Fenimore St</text>
        <text x="304" y="330" transform="rotate(72 304 330)">Bedford Ave</text>
        <text x="46" y="320" opacity=".9">Prospect Park</text>
        <text x="52" y="640" opacity=".9">Lakeside</text>
      </g>
      <g fill="#26272c" fontSize="11.5" fontWeight="700" fontFamily="system-ui">
        <rect x="196" y="440" width="26" height="16" rx="8" fill="#26272c"/>
        <text x="203" y="452" fill="#fff" fontSize="9">PP</text>
        <text x="228" y="453">Prospect Pk</text>
      </g>
    </svg>
  );
}

/* staggered entrance item (no overshoot) */
const itemVariants = {
  hidden: { opacity: 0, y: 26 },
  show:   { opacity: 1, y: 0, transition: SNAP },
};
const Item = ({ className, children, style }) => (
  <motion.div className={className} style={style} variants={itemVariants}>{children}</motion.div>
);

/* ================================================================
   Screens
   ================================================================ */
function HomeScreen({ payOpen, onPay, onHosp }) {
  return (
    <motion.section className="view" style={{ zIndex: 1 }}
      initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} transition={FADE}>
      <motion.div style={{ position: 'absolute', inset: 0 }}
        animate={payOpen
          ? { scale: 0.965, filter: 'blur(9px) saturate(.82) brightness(.9)' }
          : { scale: 1, filter: 'blur(0px) saturate(1) brightness(1)' }}
        transition={SNAP}>
        <div className="hero">
          <motion.div className="blob b2" animate={{ x: [0, -22, 0], y: [0, 18, 0] }}
            transition={{ duration: 7.6, repeat: Infinity, ease: 'easeInOut' }}/>
          <motion.div className="blob b1" animate={{ x: [0, 26, 0], y: [0, -20, 0] }}
            transition={{ duration: 6.4, repeat: Infinity, ease: 'easeInOut' }}/>
          <motion.div className="blob b3" animate={{ x: [0, 18, 0], y: [0, 24, 0] }}
            transition={{ duration: 5.8, repeat: Infinity, ease: 'easeInOut' }}/>
        </div>

        <motion.div className="home-content" initial="hidden" animate="show"
          variants={{ show: { transition: { staggerChildren: 0.09, delayChildren: 0.08 } } }}>
          <Item className="welcome">
            <div className="w-small">Welcome Back</div>
            <div className="w-name">Willie Schulist</div>
          </Item>

          <Item className="chev-row">›</Item>

          <Item>
            {/* the shared element: this card IS the pay sheet */}
            <motion.div className="premium-card" layoutId="pay-sheet" style={{ borderRadius: R_CARD }}>
              <div className="claims-strip">
                <div className="ticket">2</div>
                <span>You have 2 claims in progress</span>
              </div>
              <svg className="receipt-ghost" width="74" height="88" viewBox="0 0 74 88">
                <path d="M6 4h62v74l-8-6-8 6-8-6-8 6-8-6-8 6-8-6-6 6z" fill="#d9853f"/>
                <rect x="16" y="18" width="42" height="5" rx="2.5" fill="#fff"/>
                <rect x="16" y="30" width="30" height="5" rx="2.5" fill="#fff"/>
                <rect x="16" y="42" width="36" height="5" rx="2.5" fill="#fff"/>
              </svg>
              <div className="pc-body">
                <motion.div layoutId="pay-title" className="pc-title">3 Upcoming Premiums</motion.div>
                <motion.div layoutId="pay-due" className="pc-due"><IconClock/> Due in 27 days</motion.div>
                <div className="pc-row">
                  <div className="pc-amount">$2,322.98</div>
                  <motion.button className="btn-dark" onClick={onPay} whileTap={{ scale: 0.95 }}>
                    View Premium
                  </motion.button>
                </div>
              </div>
            </motion.div>
          </Item>

          <Item className="section-title">Services</Item>
          <Item className="services">
            {[
              ['Payment',            <svg key="i" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20"/></svg>],

/* ---------------- slide to pay ---------------- */
function SlideToPay({ payX, maxRef, disabled, onComplete }) {
  const trackRef = useRef(null), knobRef = useRef(null);
  const [max, setMax] = useState(maxRef.current);
  const [knobW, setKnobW] = useState(96);

  useEffect(() => {
    const t = trackRef.current, k = knobRef.current;
    if (t && k) {
      const m = t.clientWidth - k.offsetWidth - 12;
      setMax(m); maxRef.current = m; setKnobW(k.offsetWidth);
    }
  }, []);

  const fillW  = useTransform(payX, v => v + knobW + 6);
  const hintOp = useTransform(payX, [0, Math.max(max * 0.6, 1)], [1, 0]);

  return (
    <div className="slide-track" ref={trackRef}>
      <motion.div className="slide-fill" style={{ width: fillW }}/>
      <motion.div className="slide-hint" style={{ opacity: hintOp }}>Slide to Confirm Payment</motion.div>
      <motion.div className="knob" ref={knobRef}
        drag={disabled ? false : 'x'}
        dragConstraints={{ left: 0, right: max }}
        dragElastic={0}                    /* hard edges — no rubber band */
        dragMomentum={false}
        style={{ x: payX }}
        onDragEnd={() => {
          if (payX.get() >= max * 0.86) {
            animate(payX, max, { duration: 0.18, ease: 'easeOut' });
            onComplete();
          } else {
            animate(payX, 0, SNAP);        /* settles cleanly, no overshoot */
          }
        }}>
        Pay Now <IconArrow/>
      </motion.div>
    </div>
  );
}

/* ================================================================
   App
   ================================================================ */
function App() {
  const [screen, setScreen] = useState('home');
  const screenRef = useRef('home');
  const prevScreen = useRef('home');
  const nav = to => { prevScreen.current = screenRef.current; screenRef.current = to; setScreen(to); };

  const [payOpen, setPayOpen] = useState(false);
  const [paid, setPaid] = useState(false);
  const [hospIdx, setHospIdx] = useState(0);
  const payX = useMotionValue(0);
  const maxRef = useRef(260);

  const [scale, setScale] = useState(1);
  const [demoLabel, setDemoLabel] = useState('▶ Play demo');
  const demoBusy = useRef(false);

  useEffect(() => {
    const fit = () => setScale(Math.min((innerHeight - 110) / 872, (innerWidth - 60) / 418, 1));
    fit();
    addEventListener('resize', fit);
    return () => removeEventListener('resize', fit);
  }, []);

  /* auto-close a moment after payment succeeds */
  useEffect(() => {
    if (paid) {
      const t = setTimeout(() => setPayOpen(false), 2000);
      return () => clearTimeout(t);
    }
  }, [paid]);

  const runDemo = async () => {
    if (demoBusy.current) return;
    demoBusy.current = true;
    setDemoLabel('● Playing…');
    try {
      setPayOpen(false); nav('home'); await sleep(800);
      setPayOpen(true); await sleep(1800);
      await new Promise(res => animate(payX, maxRef.current, { duration: 1, ease: 'easeInOut', onComplete: res }));
      setPaid(true); await sleep(3000);
      nav('hospitals'); await sleep(2000);
      setHospIdx(0); nav('detail'); await sleep(2800);
      nav('hospitals'); await sleep(1100);
      nav('home');
    } finally {
      setDemoLabel('▶ Play demo');
      demoBusy.current = false;
    }
  };

  return (
    <MotionConfig transition={SNAP} reducedMotion="user">
      <div className="demo-bar">
        <button onClick={runDemo}>{demoLabel}</button>
        <span className="hint">or explore: View Premium → slide to pay · Hospitals → tap a card</span>
      </div>

      <div className="phone" style={{ transform: `scale(${scale})` }}>
        <div className="screen">
          <AnimatePresence initial={false}>
            {screen === 'home' && (
              <HomeScreen key="home" payOpen={payOpen}
                onPay={() => setPayOpen(true)} onHosp={() => nav('hospitals')}/>
            )}
            {screen === 'hospitals' && (
              <HospitalsScreen key="hospitals" animateIn={prevScreen.current !== 'detail'}
                onBack={() => nav('home')}
                onSelect={i => { setHospIdx(i); nav('detail'); }}/>
            )}
            {screen === 'detail' && (
              <DetailScreen key="detail" idx={hospIdx} onBack={() => nav('hospitals')}/>
            )}
          </AnimatePresence>

          <AnimatePresence onExitComplete={() => { setPaid(false); payX.set(0); }}>
            {payOpen && (
              <PayOverlay key="pay" paid={paid} payX={payX} maxRef={maxRef}
                onClose={() => { if (!paid) setPayOpen(false); }}
                onComplete={() => setPaid(true)}/>
            )}
          </AnimatePresence>

          <div className="notch"/>
        </div>
      </div>

      <div className="caption">
        Motion study — Framer Motion · layoutId shared elements (card → sheet, card → detail) ·
        bounce-0 springs, dragElastic 0 — no rubber-banding
      </div>
    </MotionConfig>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
